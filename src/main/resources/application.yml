spring:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  application:
    name: backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
firebase:
  credentials-path: ${GOOGLE_APPLICATION_CREDENTIALS}
app:
  jwt:
    secret-base64: ${JWT_SECRET_BASE64}
    issuer: reshito-api
    access-token-ttl-seconds: 900
